<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joaco Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="intro-screen">
            <h1>Joaco Game</h1>
            <div class="mode-buttons">
                <button id="btn-classic" class="start-btn">Clásico</button>
                <button id="btn-2p" class="start-btn">2 Jugadores</button>
                <button id="btn-dodge" class="start-btn">Quemado</button>
            </div>
            <p>usa <- o -> para mover a Joaco. (Jugador 2 usa A y D).</p>
        </div>
        
        <div id="game-over-screen" style="display: none;">
            <h1 id="game-over-title">¡Juego Terminado!</h1>
            <p id="game-over-msg"></p>
            <div class="action-buttons">
                <button id="retry-btn">Reintentar</button>
                <button id="menu-btn-gameover" class="menu-btn">Menú Principal</button>
            </div>
        </div>
        
        <div id="score-board" style="display: none;">
            <h2>Score: <span id="score">0</span> / 100</h2>
            <p id="message"></p>
            <button id="menu-btn-ingame" class="menu-btn">Volver al menú</button>
        </div>
        
        <div id="game-area" style="display: none;">
            <div id="player">
                <div id="player-image"></div>
            </div>
            <div id="player2" style="display: none;">
                <div id="player-image2"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
